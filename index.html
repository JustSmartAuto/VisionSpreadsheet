<style>
  :root{
    --chrome:#404040;
    --chrome-hi:#4a4a4a;
    --canvas:#565656;
    --line:#2b2b2b;
    --field:#4a4a4a;
    --field-border:#8a8a8a;
    --text:#f0f0f0;
    --muted:#b9b9b9;
    --roi:#ff1e1e;
    --handle:#ff00ff;
    --dlg-bg:#666666;
    --dlg-title:#4a4a4a;
    --focus:#c9b13e;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;overflow:hidden;
    background:var(--chrome);
    color:var(--text);
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    font-size:12px;
    user-select:none;
  }

  /* ---------- 主窗口 ---------- */
  #app{height:100vh;display:grid;grid-template-rows:34px 26px 1fr 18px;}

  #toolbar{
    display:flex;align-items:center;gap:2px;
    padding:0 4px;background:var(--chrome);
    border-bottom:1px solid var(--line);
    white-space:nowrap;overflow:hidden;
  }
  .tb-btn{
    width:22px;height:24px;padding:2px;
    display:inline-flex;align-items:center;justify-content:center;
    background:transparent;border:1px solid transparent;border-radius:2px;
    color:#dcdcdc;cursor:pointer;flex:0 0 auto;
  }
  .tb-btn:hover{background:#565656;border-color:#6a6a6a;}
  .tb-btn:active{background:#303030;}
  .tb-btn.on{background:#5a5a5a;border-color:#c9b13e;color:#fff;}
  .tb-btn svg{width:16px;height:16px;display:block;}
  .tb-sep{width:1px;height:20px;background:#6a6a6a;margin:0 4px;flex:0 0 auto;}
  .tb-spacer{flex:0 1 10px;}

  #comboC{
    height:23px;width:118px;margin-left:4px;
    background:var(--field);color:var(--text);
    border:1px solid var(--field-border);border-radius:0;
    font-family:inherit;font-size:12px;padding:0 4px;outline:none;
    flex:0 0 auto;
  }
  #comboC option{background:#4a4a4a;}
  .eq{color:#e6e6e6;margin:0 5px;font-size:13px;flex:0 0 auto;}
  #roiName{
    height:23px;width:150px;flex:0 0 auto;
    background:var(--field);color:#7fd4ff;
    border:1px solid var(--field-border);border-radius:0;
    font-family:inherit;font-size:12px;padding:0 5px;outline:none;
  }
  #note{
    height:23px;flex:1 1 auto;min-width:80px;margin-left:0;
    background:var(--field);color:#d8d8d8;
    border:1px solid var(--field-border);border-left:none;border-radius:0;
    font-family:inherit;font-size:11px;padding:0 6px;outline:none;
  }
  .tb-check{
    width:22px;height:24px;margin-left:6px;
    display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
    cursor:pointer;
  }
  .box{
    width:13px;height:13px;border:1px solid #9a9a9a;background:#3f3f3f;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:10px;line-height:1;color:#fff;
  }
  .box.on{background:#e6e6e6;border-color:#c8c8c8;}
  .box.on::after{content:"✓";color:#2a2a2a;font-weight:700;}
  #indexLabel{color:#e8e8e8;margin-left:10px;flex:0 0 auto;font-size:11px;}

  #stage{position:relative;overflow:hidden;background:var(--canvas);cursor:default;}
  #stage.dragging{outline:2px dashed #c9b13e;outline-offset:-4px;}
  #cv{display:block;width:100%;height:100%;}

  #hint{
    position:absolute;right:10px;bottom:8px;
    color:#e9e9e9;background:rgba(0,0,0,.28);
    border:1px solid rgba(255,255,255,.12);
    padding:2px 6px;font-size:10px;pointer-events:none;
    opacity:.9;
  }
  #hint.msg{background:rgba(0,0,0,.75);color:#ffe066;border-color:rgba(255,224,102,.5);opacity:1;}

  #statusbar{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:0 8px;background:var(--chrome);color:#ececec;
    font-size:10px;border-top:1px solid var(--line);
    white-space:nowrap;overflow:hidden;
  }
  #statusRight{color:#c9c9c9;overflow:hidden;text-overflow:ellipsis;}

  /* ---------- 属性页 ---------- */
  #dialogWrap{
    position:fixed;inset:0;display:none;z-index:20;
    background:rgba(0,0,0,.10);
  }
  #dialogWrap.open{display:block;}
  #dialog{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:421px;height:757px;max-height:96vh;
    background:var(--dlg-bg);color:var(--text);
    border:1px solid #2f2f2f;
    box-shadow:0 10px 34px rgba(0,0,0,.55);
    display:flex;flex-direction:column;
    font-size:12px;
  }
  .dlg-title{
    height:30px;flex:0 0 auto;background:var(--dlg-title);
    display:flex;align-items:center;padding-left:9px;
    font-size:12px;color:#ededed;
  }
  .dlg-title .title-text{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .win-btns{display:flex;flex:0 0 auto;}
  .win-btn{
    width:38px;height:30px;display:flex;align-items:center;justify-content:center;
    color:#e6e6e6;cursor:pointer;font-size:12px;
  }
  .win-btn:hover{background:#5a5a5a;}
  .win-btn.close:hover{background:#c0392b;}

  .dlg-menu{
    height:23px;flex:0 0 auto;background:var(--chrome);
    display:flex;align-items:center;gap:2px;padding-left:7px;
  }
  .menu-item{padding:2px 6px;cursor:default;color:#e8e8e8;}
  .menu-item:hover{background:#5a5a5a;}
  .menu-item.active{border:1px solid #a0a0a0;padding:1px 5px;background:#555;}

  .dlg-tools{
    height:30px;flex:0 0 auto;display:flex;align-items:center;gap:3px;
    padding:0 6px;background:var(--dlg-bg);border-bottom:1px solid #5a5a5a;
  }
  .dlg-tools .tb-btn{width:24px;height:24px;}

  .dlg-body{
    padding:8px 14px 4px;overflow-y:auto;flex:1 1 auto;
    scrollbar-width:thin;scrollbar-color:#5a5a5a #4a4a4a;
  }
  .row{display:flex;align-items:center;min-height:31px;margin:0;}
  .row>.lbl{width:88px;flex:0 0 auto;color:#e6e6e6;}
  .row>.lbl.right{text-align:right;padding-right:8px;}
  .field{
    height:24px;background:var(--field);color:#f2f2f2;
    border:1px solid var(--field-border);border-radius:0;
    font-family:inherit;font-size:12px;padding:0 5px;outline:none;
    flex:1 1 auto;min-width:0;
  }
  .field:focus{border-color:#bdbdbd;}
  .ro{background:#4a4a4a;color:#dcdcdc;}
  .field.var{color:#4fa3ff;}
  .num-wrap{position:relative;flex:0 0 205px;width:205px;}
  .num-field{
    width:100%;height:24px;background:var(--field);color:#f2f2f2;
    border:1px solid var(--field-border);border-radius:0;
    font-family:inherit;font-size:12px;text-align:right;
    padding:0 20px 0 6px;outline:none;
    -moz-appearance:textfield;appearance:textfield;
  }
  .num-field::-webkit-outer-spin-button,
  .num-field::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .spin-btns{
    position:absolute;right:2px;top:3px;bottom:3px;width:15px;
    display:flex;flex-direction:column;
  }
  .spin-btns button{
    flex:1;width:15px;padding:0;line-height:1;
    background:#8c8c8c;color:#202020;border:1px solid #6a6a6a;border-radius:0;
    font-size:6px;cursor:pointer;
  }
  .spin-btns button:hover{background:#a5a5a5;}
  .eq-mark{width:12px;flex:0 0 auto;color:#d8d8d8;margin-left:5px;}
  .var-icon{width:12px;height:12px;border:1px solid #d8d8d8;flex:0 0 auto;display:inline-block;}

  .row.group{gap:6px;margin-top:6px;}
  .group-icon{width:14px;height:14px;border:1px solid #d8d8d8;position:relative;}
  .group-icon::before,.group-icon::after{
    content:"";position:absolute;background:#d8d8d8;
  }
  .group-icon::before{left:1px;right:1px;top:3px;height:1px;}
  .group-icon::after{top:1px;bottom:1px;left:3px;width:1px;}
  .group-name{font-weight:600;color:#f0f0f0;}
  .group-val{color:#cfcfcf;margin-left:16px;font-size:11px;}

  .chk-row{display:flex;align-items:center;min-height:31px;margin:0;}
  .chk-row .lbl{width:88px;flex:0 0 auto;color:#e6e6e6;}
  .chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;}

  .field-name{width:205px;flex:0 0 205px;}

  .row.focus-row{background:linear-gradient(to right,#8c8c8c 0%,#7a7a7a 60%,#4a4a4a 100%);}
  .row.focus-row>.lbl{
    color:#fff200;font-weight:700;
    display:flex;align-items:center;width:88px;flex:0 0 88px;
  }

  .combo{position:relative;flex:0 0 205px;width:205px;}
  .combo>button{
    width:100%;height:26px;text-align:left;padding:0 22px 0 6px;
    background:#666;color:#f2f2f2;border:1px solid #9a9a9a;
    border-radius:0;font-family:inherit;font-size:12px;position:relative;cursor:pointer;
  }
  .combo>button::after{
    content:"";position:absolute;right:6px;top:9px;
    border:4px solid transparent;border-top-color:#e0e0e0;
  }
  .combo-list{
    position:absolute;left:0;right:0;top:26px;display:none;z-index:5;
    background:#8c8c8c;border:1px solid #b7b7b7;border-top:none;
  }
  .combo-list div{
    padding:5px 6px;color:#f2f2f2;cursor:pointer;
  }
  .combo-list div:hover{background:#6a6a6a;}
  .combo-list div.sel{background:#4a4a4a;}
  .combo.open .combo-list{display:block;}
  .combo-val{width:6px;flex:0 0 auto;}
  .combo-eq{width:26px;flex:0 0 auto;color:#fff200;text-align:center;}

<script>
  // p5 负责创建画布并管理像素密度；编辑器绘制通过 drawingContext（Canvas2D）完成，
  // 交互与重绘仍由事件驱动，因此关闭 p5 的自动循环（noLoop）。
  function setup(){
    const st = document.getElementById("stage");
    const c = createCanvas(Math.max(1, st.clientWidth), Math.max(1, st.clientHeight));
    c.parent(st);
    c.elt.id = "cv";
    noLoop();
    bootEditor(c.elt);
  }
  function draw(){}

<script>
function bootEditor(cvEl){
  "use strict";

  const IMG_SRC = "../图像_0000_20261102055654.png";
  const cv = cvEl;
  const stage = document.getElementById("stage");
  const ctx = cv.getContext("2d");

  // ---------- 状态（ROI 一律以图像坐标存储） ----------
  const state = {
    img: new Image(),
    imgLoaded: false,
    imgLoading: true,       // 首图加载中
    imgData: null,          // 原图像素缓存，用于 RGB 读数
    imgName: "",            // 当前图像来源（JSON 文件名 / 内置测试图）
    imgB64: null,           // 由 JSON imageData 载入时的 base64 载荷（导出时原样复用）
    jsonName: "",           // 最近载入的 JSON 文件名
    fitScale: 1,
    zoom: 1,
    panX: 0,
    panY: 0,
    dpr: window.devicePixelRatio || 1,
    regions: [
      // 截图 (1)：位置=1402.838 大小=866x822 旋转=0.0°（图像坐标，中心点存储）
      { name: "EditRegion1", x: 1835.838, y: 1238, w: 866, h: 822, angle: 0 }
    ],
    selected: 0,
    displayMode: "input",   // hidden | input
    showAxes: true,
    showLabels: true,       // 是否绘制标注名称（对齐显示工具 v5 的标签开关）
    allowMove: true,
    allowSize: true,
    allowRotate: true,
    allowCurve: true,
    drag: null,
    cursor: null
  };
  const COLORS = { roi: "#ff0000", handle: "#ff00ff", axisX: "#ff0000", axisY: "#ff00ff" };

  function sel(){ return state.regions[state.selected] || null; }
  function deg2rad(d){ return d * Math.PI / 180; }
  function rad2deg(r){ return r * 180 / Math.PI; }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function fmt3(v){ return (Math.round(v*1000)/1000).toFixed(3); }

  // ---------- 视图变换：图像 / 画布 / 面板 / 屏幕 ----------
  function view(){
    const cw = stage.clientWidth, ch = stage.clientHeight;
    const iw = state.imgLoaded ? state.img.naturalWidth : 1024;
    const ih = state.imgLoaded ? state.img.naturalHeight : 753;
    const s = state.fitScale * state.zoom;
    const w = iw * s, h = ih * s;
    const ox = (cw - w) / 2 + state.panX;
    const oy = (ch - h) / 2 + state.panY;
    return { cw, ch, s, ox, oy, w, h, iw, ih };
  }
  function canvasToImage(cx, cy){
    const v = view();
    return { x: (cx - v.ox) / v.s, y: (cy - v.oy) / v.s };
  }
  function imageToCanvas(ix, iy){
    const v = view();
    return { x: v.ox + ix * v.s, y: v.oy + iy * v.s };
  }
  function localToImage(r, lx, ly){
    const a = deg2rad(r.angle), c = Math.cos(a), s = Math.sin(a);
    return { x: r.x + lx*c - ly*s, y: r.y + lx*s + ly*c };
  }
  function imageToLocal(r, ix, iy){
    const a = deg2rad(r.angle), c = Math.cos(a), s = Math.sin(a);
    const dx = ix - r.x, dy = iy - r.y;
    return { x: dx*c + dy*s, y: -dx*s + dy*c };
  }
  function cornersImage(r){
    const hw = r.w/2, hh = r.h/2;
    return [
      localToImage(r, -hw,-hh), localToImage(r,  hw,-hh),
      localToImage(r,  hw, hh), localToImage(r, -hw, hh)
    ];
  }
  function cornersCanvas(r){
    return cornersImage(r).map(p => imageToCanvas(p.x, p.y));
  }
  const HANDLES = [
    {id:"nw", lx:-1, ly:-1}, {id:"n", lx:0, ly:-1}, {id:"ne", lx:1, ly:-1},
    {id:"e",  lx:1, ly:0},                          {id:"se", lx:1, ly:1},
    {id:"s",  lx:0, ly:1},  {id:"sw", lx:-1, ly:1}, {id:"w", lx:-1, ly:0}
  ];

  // ---------- 弯曲：四条边中点可推拉成圆弧（法向挠度，图像 px，外正内负） ----------
  // 边序号 0=上(nw→ne) 1=右(ne→se) 2=下(se→sw) 3=左(sw→nw)
  const EDGE_KEYS = ["bT", "bR", "bB", "bL"];
  const EDGE_NORMALS = [{x:0,y:-1},{x:1,y:0},{x:0,y:1},{x:-1,y:0}]; // 本地坐标外法线
  const EDGE_OF_HANDLE = { n:0, e:1, s:2, w:3 };

  function edgeBend(r, e){
    const v = r[EDGE_KEYS[e]];
    return Number.isFinite(v) ? v : 0;
  }
  function setEdgeBend(r, e, v){ r[EDGE_KEYS[e]] = v; }
  function hasBend(r){
    return EDGE_KEYS.some(k => Math.abs(Number(r[k]) || 0) >= 0.5);
  }
  // 边中点的本地坐标：外法线 × 该方向的半边长（上下边沿高度，左右边沿宽度）
  function edgeMidLocal(r, e){
    const n = EDGE_NORMALS[e];
    const half = (e % 2 === 0) ? r.h/2 : r.w/2;
    return { x: n.x*half, y: n.y*half };
  }
  // 二次贝塞尔控制点：中点沿外法线偏移 2×挠度，曲线 t=0.5 处恰好达到挠度值
  function edgeCtrlImage(r, e){
    const m = edgeMidLocal(r, e), nrm = EDGE_NORMALS[e], b = edgeBend(r, e);
    return localToImage(r, m.x + nrm.x*2*b, m.y + nrm.y*2*b);
  }
  // 弧上一点（图像坐标）；挠度不足 0.5px 时退化为直线
  function edgePointImage(r, e, t){
    const cs = cornersImage(r);
    const A = cs[e], B = cs[(e+1)%4];
    if (Math.abs(edgeBend(r, e)) < 0.5){
      return { x: A.x + (B.x-A.x)*t, y: A.y + (B.y-A.y)*t };
    }
    const C = edgeCtrlImage(r, e), it = 1-t;
    return {
      x: it*it*A.x + 2*it*t*C.x + t*t*B.x,
      y: it*it*A.y + 2*it*t*C.y + t*t*B.y
    };
  }

  // 8 个手柄：四角=缩放；四边中点=弯曲（位置随挠度落在弧顶）
  function handlePointsCanvas(r){
    return HANDLES.map(h => {
      const e = EDGE_OF_HANDLE[h.id];
      let p;
      if (e !== undefined){
        const b = edgeBend(r, e), m = edgeMidLocal(r, e), nrm = EDGE_NORMALS[e];
        p = localToImage(r, m.x + nrm.x*b, m.y + nrm.y*b);
      } else {
        p = localToImage(r, h.lx*r.w/2, h.ly*r.h/2);
      }
      const q = imageToCanvas(p.x, p.y);
      return { id:h.id, x:q.x, y:q.y, bendEdge:e };
    });
  }

  // 旋转柄：底边中点外侧固定 26 画布像素处（与弯曲柄分开，避免争用）
  function rotateHandleCanvas(r){
    const e = 2, b = edgeBend(r, e), m = edgeMidLocal(r, e), nrm = EDGE_NORMALS[e];
    const p = localToImage(r, m.x + nrm.x*b, m.y + nrm.y*b);
    const q = imageToCanvas(p.x, p.y);
    const a = deg2rad(r.angle);
    return { x: q.x - Math.sin(a)*26, y: q.y + Math.cos(a)*26 };
  }
  function pointInRegion(r, ix, iy){
    const p = imageToLocal(r, ix, iy);
    return Math.abs(p.x) <= r.w/2 && Math.abs(p.y) <= r.h/2;
  }

  // ---------- 绘制 ----------
  function resizeCanvas(){
    const cw = stage.clientWidth, ch = stage.clientHeight;
    // 画布尺寸交给 p5（内部按 pixelDensity 处理 DPR），编辑器仍以 CSS 像素坐标绘制
    window.resizeCanvas(Math.max(1, cw), Math.max(1, ch));
    state.dpr = window.pixelDensity();
    if (state.imgLoaded){
      const fit = Math.min(cw / state.img.naturalWidth, ch / state.img.naturalHeight);
      if (!state.fitLocked) state.fitScale = fit;
    }
    draw();
  }
  function fitView(){
    const cw = stage.clientWidth, ch = stage.clientHeight;
    state.fitScale = Math.min(cw / state.img.naturalWidth, ch / state.img.naturalHeight);
    state.zoom = 1; state.panX = 0; state.panY = 0;
    state.fitLocked = true;
    draw();
  }

  function draw(){
    const v = view();
    ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    ctx.fillStyle = "#565656";
    ctx.fillRect(0, 0, v.cw, v.ch);

    if (state.imgLoaded){
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(state.img, v.ox, v.oy, v.w, v.h);
    } else if (state.imgLoading){
      ctx.fillStyle = "#cfcfcf";
      ctx.font = "13px 'Segoe UI','Microsoft YaHei',sans-serif";
      ctx.fillText("正在加载测试图像 …", 20, 30);
    } else {
      ctx.fillStyle = "#cfcfcf";
      ctx.font = "13px 'Segoe UI','Microsoft YaHei',sans-serif";
      ctx.fillText("未载入图像：拖入 .json 标注文件，或点击工具栏上传", 20, 30);
    }

    if (state.displayMode === "hidden"){ updateStatus(); return; }

    // ROI：先画非选中，再画选中
    state.regions.forEach((r, i) => { if (i !== state.selected) drawRegion(r, false); });
    const r = sel();
    if (r) drawRegion(r, true);
    updateStatus();
  }

  function drawRegion(r, isSel){
    const pts = cornersCanvas(r);
    const ctrls = [0,1,2,3].map(e => {
      const p = edgeCtrlImage(r, e);
      return imageToCanvas(p.x, p.y);
    });
    ctx.save();
    ctx.strokeStyle = COLORS.roi;
    ctx.lineWidth = isSel ? 2 : 1.2;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let e = 0; e < 4; e++){
      const B = pts[(e+1) % 4];
      if (Math.abs(edgeBend(r, e)) >= 0.5){
        ctx.quadraticCurveTo(ctrls[e].x, ctrls[e].y, B.x, B.y);
      } else {
        ctx.lineTo(B.x, B.y);
      }
    }
    ctx.closePath();
    ctx.stroke();

    // 标签：贴近左上角绘制名称（对齐显示工具 v5 的标签显示）
    if (state.showLabels){
      ctx.font = "12px 'Segoe UI','Microsoft YaHei',sans-serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "bottom";
      ctx.shadowColor = "rgba(0,0,0,.85)";
      ctx.shadowBlur = 3;
      ctx.fillStyle = isSel ? "#ffe066" : "#ffffff";
      ctx.fillText(r.name, pts[0].x + 4, pts[0].y - 4);
      ctx.shadowBlur = 0;
      ctx.shadowColor = "transparent";
    }

    if (!isSel) { ctx.restore(); return; }

    // 句柄：品红细框 + 白色内芯（四角缩放，四边中点弯曲）；位置随弯曲落在弧顶
    handlePointsCanvas(r).forEach(h => {
      const s = 4;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(h.x - s, h.y - s, s*2, s*2);
      ctx.strokeStyle = COLORS.handle;
      ctx.lineWidth = 2;
      ctx.strokeRect(h.x - s + 1, h.y - s + 1, s*2 - 2, s*2 - 2);
    });

    // 旋转柄：底边中点外侧的圆形 ↻（连线提示其归属），按住拖动可旋转区域
    if (state.allowRotate){
      const rh = rotateHandleCanvas(r);
      const base = handlePointsCanvas(r).find(h => h.id === "s");
      if (base){
        ctx.save();
        ctx.strokeStyle = "rgba(255,0,255,.5)";
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(base.x, base.y); ctx.lineTo(rh.x, rh.y); ctx.stroke();
        ctx.restore();
      }
      drawRotateHandle(rh);
    }

    // 坐标轴：绘制在句柄之上（截图里 x/y 箭头遮住了 n/w 句柄），方向跟随 ROI 旋转角
    if (state.showAxes){
      const o = pts[0];                 // 左上角（本地坐标 -w/2,-h/2）
      const len = 78;
      const a = deg2rad(r.angle), ca = Math.cos(a), sa = Math.sin(a);
      const ux = ca, uy = sa;           // 本地 +x 在画布中的方向
      const vx = -sa, vy = ca;          // 本地 +y 在画布中的方向
      const ex = o.x + ux * len, ey = o.y + uy * len;   // x 轴箭头终点
      const gy = { x: o.x + vx * len, y: o.y + vy * len }; // y 轴箭头终点
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = COLORS.axisX;
      arrow(o.x, o.y, ex, ey);
      ctx.fillStyle = COLORS.axisX; ctx.font = "11px 'Segoe UI',sans-serif";
      ctx.fillText("x", ex - 6*ux - 5*vx, ey - 6*uy - 5*vy);
      ctx.strokeStyle = COLORS.axisY;
      arrow(o.x, o.y, gy.x, gy.y);
      ctx.fillStyle = COLORS.axisY;
      ctx.fillText("y", gy.x - 4*vx - 13*ux, gy.y - 4*vy - 13*uy);
    }
    ctx.restore();
  }

  function arrow(x1,y1,x2,y2){
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    const a = Math.atan2(y2-y1, x2-x1);
    ctx.beginPath();
    ctx.moveTo(x2,y2);
    ctx.lineTo(x2 - 6*Math.cos(a-0.42), y2 - 6*Math.sin(a-0.42));
    ctx.lineTo(x2 - 6*Math.cos(a+0.42), y2 - 6*Math.sin(a+0.42));
    ctx.closePath(); ctx.fillStyle = ctx.strokeStyle; ctx.fill();
  }

  // 底边中点的旋转柄：品红圆环 + 箭头（↻ 字形，缺口在右侧）
  function drawRotateHandle(p){
    const rad = 6.2;
    ctx.save();
    ctx.strokeStyle = COLORS.handle;
    ctx.fillStyle = COLORS.handle;
    ctx.lineWidth = 2;
    const a0 = deg2rad(55), a1 = deg2rad(-55);
    ctx.beginPath();
    ctx.arc(p.x, p.y, rad, a1, a0, true);
    ctx.stroke();

    // 箭头位于缺口下端，朝右（与截图一致）
    const tx = p.x + rad*Math.cos(a0), ty = p.y + rad*Math.sin(a0);
    const dir = deg2rad(-10);
    const L = 5.5;
    ctx.beginPath();
    ctx.moveTo(tx + L*Math.cos(dir), ty + L*Math.sin(dir));
    ctx.lineTo(tx - L*0.7*Math.cos(dir - 0.6), ty - L*0.7*Math.sin(dir - 0.6));
    ctx.lineTo(tx - L*0.7*Math.cos(dir + 0.6), ty - L*0.7*Math.sin(dir + 0.6));
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // ---------- 状态栏 ----------
  const hintEl = document.getElementById("hint");
  const DEFAULT_HINT = hintEl.textContent;
  let hintTimer = null;
  function notify(msg){
    hintEl.textContent = msg;
    hintEl.classList.add("msg");
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => {
      hintEl.textContent = DEFAULT_HINT;
      hintEl.classList.remove("msg");
    }, 4000);
  }

  function updateStatus(){
    syncRoiInfo();
    const r = sel();
    const el = document.getElementById("statusLeft");
    if (!r){ el.textContent = "位置=— 大小=— 旋转=— 拟合=—"; return; }
    el.textContent =
      `位置=${fmt3(r.x - r.w/2)} 大小=${Math.round(r.w)}×${Math.round(r.h)} ` +
      `旋转=${r.angle.toFixed(1)}° ` +
      (hasBend(r) ? `拟合=多边形(${regionPolygonPoints(r).length} 点)` : "拟合=矩形(4 点)");

    const v = view();
    const right = document.getElementById("statusRight");
    let s = `${state.imgName || "内置测试图"} · 标注 ${state.regions.length} 个 · ` +
            `图像 ${v.iw}×${v.ih} · 画布 ${v.cw}×${v.ch} · 缩放 ${(v.s*100).toFixed(1)}%`;
    if (state.cursor){
      const p = canvasToImage(state.cursor.cx, state.cursor.cy);
      const rect = cv.getBoundingClientRect();
      s += ` · 光标 图像(${p.x.toFixed(1)}, ${p.y.toFixed(1)})` +
           ` 画布(${Math.round(state.cursor.cx)}, ${Math.round(state.cursor.cy)})` +
           ` 屏幕(${Math.round(rect.left + state.cursor.cx)}, ${Math.round(rect.top + state.cursor.cy)})`;
      const rgb = sampleRGB(p.x, p.y);
      if (rgb) s += ` RGB(${rgb})`;
    }
    right.textContent = s + " · F2 属性页";
  }

  function sampleRGB(ix, iy){
    if (!state.imgData) return null;
    const x = Math.floor(ix), y = Math.floor(iy);
    if (x < 0 || y < 0 || x >= state.imgData.width || y >= state.imgData.height) return null;
    const d = state.imgData.data, i = (y * state.imgData.width + x) * 4;
    if (d[i+1] === d[i] && d[i+2] === d[i]) return d[i];
    return `${d[i]},${d[i+1]},${d[i+2]}`;
  }

  // ---------- 交互 ----------
  cv.addEventListener("pointerdown", e => {
    cv.setPointerCapture(e.pointerId);
    const rect = cv.getBoundingClientRect();
    const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
    const r = sel();

    // 1) 句柄（仅选中区域）
    if (r){
      // 底边外侧：旋转柄（阻尼旋转）
      if (state.allowRotate){
        const rh = rotateHandleCanvas(r);
        if (Math.hypot(rh.x-cx, rh.y-cy) <= 9){
          const p0 = canvasToImage(cx, cy);
          state.drag = { mode:"rotate", damp:true,
                         lastAng: Math.atan2(p0.y - r.y, p0.x - r.x) };
          cv.style.cursor = "grabbing";
          return;
        }
      }
      if (state.allowRotate && e.altKey){
        for (const h of handlePointsCanvas(r)){
          if (Math.hypot(h.x-cx, h.y-cy) <= 7 && (h.id === "ne" || h.id === "nw" || h.id === "se" || h.id === "sw")){
            state.drag = { mode:"rotate", startAngle:r.angle,
                           startImg:canvasToImage(cx, cy) };
            return;
          }
        }
      }
      const handles = handlePointsCanvas(r);
      // 四边中点：弯曲（按住推拉边中点，该边变为圆弧）
      if (state.allowCurve){
        for (const h of handles){
          if (h.bendEdge === undefined) continue;
          if (Math.hypot(h.x-cx, h.y-cy) <= 7){
            const startImg = canvasToImage(cx, cy);
            state.drag = { mode:"bend", edge:h.bendEdge,
                           startBend:edgeBend(r, h.bendEdge),
                           startLocal:imageToLocal(r, startImg.x, startImg.y) };
            return;
          }
        }
      }
      // 四角：缩放
      if (state.allowSize){
        for (const h of handles){
          if (h.bendEdge !== undefined) continue;
          if (Math.hypot(h.x-cx, h.y-cy) <= 7){
            const startImg = canvasToImage(cx, cy);
            state.drag = { mode:"resize", handle:h.id,
                           start:{x:r.x,y:r.y,w:r.w,h:r.h,angle:r.angle},
                           startImg,
                           startLocal:imageToLocal(r, startImg.x, startImg.y) };
            return;
          }
        }
      }
    }

    // 2) 命中区域（取最上层）
    const p = canvasToImage(cx, cy);
    for (let i = state.regions.length - 1; i >= 0; i--){
      if (pointInRegion(state.regions[i], p.x, p.y)){
        state.selected = i;
        syncToolbar();
        if (state.allowMove && !e.altKey){
          state.drag = { mode:"move", start:{x:state.regions[i].x, y:state.regions[i].y},
                         startImg:p };
        }
        draw();
        return;
      }
    }

    // 3) 空白：平移
    state.drag = { mode:"pan", startX:cx, startY:cy, panX:state.panX, panY:state.panY };
  });

  cv.addEventListener("pointermove", e => {
    const rect = cv.getBoundingClientRect();
    const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
    state.cursor = { cx, cy };
    const r = sel();
    const img = canvasToImage(cx, cy);

    if (state.drag){
      const d = state.drag;
      if (d.mode === "pan"){
        state.panX = d.panX + (cx - d.startX);
        state.panY = d.panY + (cy - d.startY);
      } else if (d.mode === "move" && r){
        r.x = clamp(d.start.x + (img.x - d.startImg.x), -1e5, 1e5);
        r.y = clamp(d.start.y + (img.y - d.startImg.y), -1e5, 1e5);
      } else if (d.mode === "rotate" && r){
        const a1 = Math.atan2(img.y - r.y, img.x - r.x);
        if (d.damp){
          // 阻尼旋转：按相对上一次指针角度的增量累加，并限制单次幅度，防止转得过快
          let da = rad2deg(a1 - d.lastAng);
          while (da > 180) da -= 360;
          while (da < -180) da += 360;
          da = clamp(da, -4, 4);
          r.angle += da * 0.175;
          d.lastAng = a1;
          normalizeAngle(r);
        } else {
          const a0 = Math.atan2(d.startImg.y - r.y, d.startImg.x - r.x);
          r.angle = d.startAngle + rad2deg(a1 - a0);
          normalizeAngle(r);
        }
      } else if (d.mode === "bend" && r){
        // 弯曲：把指针位移投影到该边的外法线上，累加到挠度
        const l1 = imageToLocal(r, img.x, img.y);
        const dx = l1.x - d.startLocal.x, dy = l1.y - d.startLocal.y;
        const n = EDGE_NORMALS[d.edge];
        const lim = Math.max(8, Math.min(r.w, r.h));
        setEdgeBend(r, d.edge, clamp(d.startBend + dx*n.x + dy*n.y, -0.6*lim, 1.5*lim));
      } else if (d.mode === "resize" && r){
        resizeByHandle(d, img);
      }
      draw();
      return;
    }

    // 光标反馈
    let cur = "default";
    if (r){
      let onHandle = false, onBend = false, onRotate = false;
      if (state.allowRotate){
        const rh = rotateHandleCanvas(r);
        onRotate = Math.hypot(rh.x-cx, rh.y-cy) <= 9;
      }
      for (const h of handlePointsCanvas(r)){
        if (Math.hypot(h.x-cx, h.y-cy) <= 7){
          if (h.bendEdge !== undefined) onBend = true; else onHandle = true;
        }
      }
      if (onRotate && state.allowRotate) cur = "grab";
      else if (onBend && state.allowCurve) cur = "crosshair";
      else if (onHandle && state.allowSize) cur = "nwse-resize";
      else if (pointInRegion(r, img.x, img.y) && state.allowMove) cur = "move";
    }
    cv.style.cursor = cur;
    updateStatus();
  });

  cv.addEventListener("pointerup", e => {
    if (state.drag){
      state.drag = null;
      cv.style.cursor = "default";
      try { cv.releasePointerCapture(e.pointerId); } catch(_){}
      syncToolbar();
      draw();
    }
  });

  cv.addEventListener("pointercancel", () => { state.drag = null; cv.style.cursor = "default"; });

  cv.addEventListener("dblclick", () => openDialog());

  cv.addEventListener("wheel", e => {
    e.preventDefault();
    const rect = cv.getBoundingClientRect();
    const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
    const before = canvasToImage(cx, cy);
    const factor = e.deltaY < 0 ? 1.1 : 0.9;
    state.zoom = clamp(state.zoom * factor, 0.1, 10);
    const v = view();
    const wantX = cx - before.x * v.s;
    const wantY = cy - before.y * v.s;
    state.panX += wantX - v.ox;
    state.panY += wantY - v.oy;
    state.cursor = { cx, cy };
    draw();
  }, { passive:false });

  function normalizeAngle(r){
    while (r.angle > 180) r.angle -= 360;
    while (r.angle < -180) r.angle += 360;
  }

  function resizeByHandle(d, img){
    const r = sel();
    if (!r) return;
    const st = d.start;
    const a = deg2rad(st.angle);
    const p = { x: img.x - st.x, y: img.y - st.y };
    const lx =  p.x*Math.cos(a) + p.y*Math.sin(a);
    const ly = -p.x*Math.sin(a) + p.y*Math.cos(a);
    const sx = d.handle.includes("e") ? 1 : d.handle.includes("w") ? -1 : 0;
    const sy = d.handle.includes("s") ? 1 : d.handle.includes("n") ? -1 : 0;

    let nw = st.w + sx * (lx - d.startLocal.x);
    let nh = st.h + sy * (ly - d.startLocal.y);
    nw = Math.max(8, nw); nh = Math.max(8, nh);

    const ox = (nw - st.w) * sx / 2;
    const oy = (nh - st.h) * sy / 2;
    r.w = nw; r.h = nh;
    r.x = st.x + ox*Math.cos(a) - oy*Math.sin(a);
    r.y = st.y + ox*Math.sin(a) + oy*Math.cos(a);
    r.angle = st.angle;
  }

  // ---------- 工具栏 ----------
  function syncToolbar(){
    const r = sel();
    document.getElementById("roiName").value = r ? r.name : "";
    document.getElementById("note").value = r
      ? `ROI 编辑器 Mock · 区域 ${state.selected+1}/${state.regions.length} · 图像坐标（px）`
      : "ROI 编辑器 Mock · 无区域";
    document.getElementById("indexLabel").textContent = `# ${Math.min(state.selected+1, state.regions.length)}`;
  }

  // ---------- ROI 信息编辑栏（直接输入参数，精度高于鼠标拖动） ----------
  const riFields = ["riX","riY","riW","riH","riA"].map(id => document.getElementById(id));

  function syncRoiInfo(force){
    const r = sel();
    riFields.forEach(el => { el.disabled = !r; });
    const rp = document.getElementById("riPoly");
    if (rp) rp.textContent = r ? (hasBend(r) ? `多边形 ${regionPolygonPoints(r).length} 点` : "矩形 4 点") : "—";
    if (!r) return;
    // 正在输入时不打断用户
    if (!force && riFields.indexOf(document.activeElement) >= 0) return;
    riFields[0].value = fmt3(r.x - r.w/2);
    riFields[1].value = fmt3(r.y - r.h/2);
    riFields[2].value = fmt3(r.w);
    riFields[3].value = fmt3(r.h);
    riFields[4].value = fmt3(r.angle);
  }

  function applyRoiInfo(){
    const r = sel();
    if (!r) return;
    const left = parseFloat(riFields[0].value);
    const top  = parseFloat(riFields[1].value);
    const w    = parseFloat(riFields[2].value);
    const h    = parseFloat(riFields[3].value);
    const a    = parseFloat(riFields[4].value);
    if (Number.isFinite(w) && w >= 1) r.w = w;
    if (Number.isFinite(h) && h >= 1) r.h = h;
    if (Number.isFinite(left)) r.x = left + r.w/2;
    if (Number.isFinite(top))  r.y = top + r.h/2;
    if (Number.isFinite(a)){ r.angle = a; normalizeAngle(r); }
    syncToolbar(); draw(); syncRoiInfo(true);
  }

  riFields.forEach(el => {
    el.addEventListener("change", applyRoiInfo);
    el.addEventListener("keydown", e => {
      if (e.key === "Enter"){ e.preventDefault(); applyRoiInfo(); el.blur(); }
    });
  });
  syncRoiInfo(true);

  document.getElementById("roiName").addEventListener("change", e => {
    const r = sel();
    if (r){ r.name = e.target.value.trim() || "EditRegion"; }
    draw();
  });

  const boxAxis = document.getElementById("boxAxis");
  document.getElementById("chkAxis").addEventListener("change", e => {
    state.showAxes = e.target.checked;
    boxAxis.classList.toggle("on", state.showAxes);
    draw();
  });
  boxAxis.parentElement.addEventListener("click", e => {
    if (e.target.tagName === "INPUT") return;
    const cb = document.getElementById("chkAxis");
    cb.checked = !cb.checked;
    cb.dispatchEvent(new Event("change"));
  });

  document.getElementById("btnOverlay").addEventListener("click", () => {
    state.displayMode = state.displayMode === "hidden" ? "input" : "hidden";
    syncDisplayUI();
    draw();
  });

  document.getElementById("btnDelete").addEventListener("click", deleteSelected);
  document.getElementById("btnZoomIn").addEventListener("click", () => {
    state.zoom = clamp(state.zoom * 1.2, 0.1, 10); draw();
  });

  function deleteSelected(){
    if (!state.regions.length) return;
    state.regions.splice(state.selected, 1);
    state.selected = Math.max(0, Math.min(state.selected, state.regions.length - 1));
    syncToolbar(); draw();
  }

  function addRegion(){
    const v = view();
    const c = canvasToImage(v.cw/2, v.ch/2);
    state.regions.push({ name:`EditRegion${state.regions.length+1}`,
      x: c.x, y: c.y, w: 120, h: 120, angle: 0,
      bT: 0, bR: 0, bB: 0, bL: 0 });
    state.selected = state.regions.length - 1;
    syncToolbar(); draw();
  }

  // ---------- 载入 X-AnyLabeling 标注 JSON（上传/拖放、重置缩放、标签开关、清除） ----------
  const jsonInput = document.getElementById("fileJson");
  document.getElementById("btnLoadJson").addEventListener("click", () => jsonInput.click());
  jsonInput.addEventListener("change", e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (f) readJsonFile(f);
  });

  document.getElementById("btnFit").addEventListener("click", () => {
    if (!state.imgLoaded){ notify("未载入图像，无法适应窗口"); return; }
    fitView();
    notify("已重置缩放（适应窗口）");
  });

  const btnLabels = document.getElementById("btnLabels");
  btnLabels.addEventListener("click", () => {
    state.showLabels = !state.showLabels;
    btnLabels.classList.toggle("on", state.showLabels);
    draw();
  });

  document.getElementById("btnClear").addEventListener("click", clearAll);

  // 拖放：窗口接受文件，画布区域给出落点反馈
  window.addEventListener("dragover", e => { e.preventDefault(); });
  window.addEventListener("drop", e => { e.preventDefault(); });
  stage.addEventListener("dragover", e => { e.preventDefault(); stage.classList.add("dragging"); });
  stage.addEventListener("dragleave", e => {
    if (e.relatedTarget && stage.contains(e.relatedTarget)) return;
    stage.classList.remove("dragging");
  });
  stage.addEventListener("drop", e => {
    e.preventDefault();
    stage.classList.remove("dragging");
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) readJsonFile(f);
  });

  function readJsonFile(file){
    if (!/\.json$/i.test(file.name)){ notify(`仅支持 .json 标注文件：${file.name}`); return; }
    const fr = new FileReader();
    fr.onerror = () => notify(`读取失败：${file.name}`);
    fr.onload = () => {
      try { loadAnyLabelingJson(String(fr.result), file.name); }
      catch (err){ console.error(err); notify(`JSON 解析失败：${err.message}`); }
    };
    fr.readAsText(file);
  }

  function loadAnyLabelingJson(text, fileName){
    const data = JSON.parse(text);
    if (!data || typeof data !== "object") throw new Error("文件内容不是 JSON 对象");
    if (!Array.isArray(data.shapes)) throw new Error("缺少 shapes 数组");

    let src = null, b64 = null;
    if (typeof data.imageData === "string" && data.imageData.trim()){
      b64 = data.imageData.replace(/^data:[^,]*,/, "");
      src = "data:image/png;base64," + b64;
    }

    state.regions = data.shapes.map(shapeToRegion).filter(Boolean);
    state.selected = state.regions.length ? 0 : -1;
    state.jsonName = fileName;
    state.fitLocked = false;

    if (src){
      loadImageSrc(src, fileName, b64);
      notify(`已载入 ${fileName} · 标注 ${state.regions.length} 个`);
    } else {
      // 无内嵌图像：沿用当前图像，仅套用标注
      state.imgName = fileName;
      syncToolbar(); draw(); updateStatus();
      notify(`已载入标注 ${state.regions.length} 个（该 JSON 无 imageData，沿用当前图像）`);
    }
  }

  // X-AnyLabeling shape → ROI（rotation 取四角点；rectangle/polygon 取外接矩形）
  function shapeToRegion(s, i){
    const pts = Array.isArray(s.points)
      ? s.points.filter(p => Array.isArray(p) && p.length >= 2).map(p => ({ x: +p[0], y: +p[1] }))
      : [];
    if (!pts.length || pts.some(p => !isFinite(p.x) || !isFinite(p.y))) return null;
    const name = typeof s.label === "string" && s.label ? s.label : `EditRegion${i + 1}`;

    // polygon（弯曲 ROI 的多点拟合）：以首边方向为参考轴求方向包围盒（弯曲本身不还原）
    if (s.shape_type === "polygon" && pts.length >= 3){
      const ang = Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x);
      const ca = Math.cos(ang), sa = Math.sin(ang);
      let minU = Infinity, maxU = -Infinity, minV = Infinity, maxV = -Infinity;
      for (const p of pts){
        const u = p.x*ca + p.y*sa, v = -p.x*sa + p.y*ca;
        minU = Math.min(minU, u); maxU = Math.max(maxU, u);
        minV = Math.min(minV, v); maxV = Math.max(maxV, v);
      }
      const cu = (minU + maxU) / 2, cv = (minV + maxV) / 2;
      let deg = ang * 180 / Math.PI;
      while (deg > 180) deg -= 360;
      while (deg < -180) deg += 360;
      return {
        name, x: cu*ca - cv*sa, y: cu*sa + cv*ca,
        w: Math.max(1, maxU - minU), h: Math.max(1, maxV - minV), angle: deg,
        bT: 0, bR: 0, bB: 0, bL: 0
      };
    }

    if (s.shape_type === "rotation" && pts.length >= 4){
      const cx = pts.reduce((a, p) => a + p.x, 0) / pts.length;
      const cy = pts.reduce((a, p) => a + p.y, 0) / pts.length;
      const w = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
      const h = Math.hypot(pts[2].x - pts[1].x, pts[2].y - pts[1].y);
      let angle = Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x) * 180 / Math.PI;
      while (angle > 180) angle -= 360;
      while (angle < -180) angle += 360;
      return { name, x: cx, y: cy, w: Math.max(1, w), h: Math.max(1, h), angle };
    }

    // rectangle（两点）及其它形状：取外接矩形（轴对齐）
    const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
    const minx = Math.min.apply(null, xs), maxx = Math.max.apply(null, xs);
    const miny = Math.min.apply(null, ys), maxy = Math.max.apply(null, ys);
    return {
      name,
      x: (minx + maxx) / 2, y: (miny + maxy) / 2,
      w: Math.max(1, maxx - minx), h: Math.max(1, maxy - miny), angle: 0
    };
  }

  function clearAll(){
    state.regions = [];
    state.selected = -1;
    state.imgLoaded = false;
    state.imgLoading = false;
    state.imgData = null;
    state.imgB64 = null;
    state.imgName = "";
    state.jsonName = "";
    state.img = new Image();
    state.zoom = 1; state.panX = 0; state.panY = 0; state.fitLocked = false;
    syncToolbar(); draw(); updateStatus();
    notify("已清除图像与全部标注，可拖入或上传 JSON");
  }

  // 统一入口：内置测试图 / JSON imageData 都走这里换图
  function loadImageSrc(src, name, b64){
    state.imgName = name || "";
    state.imgB64 = b64 || null;
    state.imgLoading = true;
    const img = new Image();
    img.onload = function(){
      state.img = img;
      state.imgLoaded = true;
      state.imgLoading = false;
      // 原图像素缓存（RGB 读数）
      try {
        const off = document.createElement("canvas");
        off.width = img.naturalWidth; off.height = img.naturalHeight;
        const octx = off.getContext("2d");
        octx.drawImage(img, 0, 0);
        state.imgData = octx.getImageData(0, 0, off.width, off.height);
      } catch (err){ state.imgData = null; }
      resizeCanvas();
      fitView();
      syncToolbar();
      syncDisplayUI();
    };
    img.onerror = function(){
      state.imgLoading = false;
      state.imgLoaded = false;
      draw();
    };
    img.src = src;
  }

  // ---------- 导出 X-AnyLabeling 标注 JSON（只用 imageData 存图，不写 imagePath） ----------
  document.getElementById("btnExportJson").addEventListener("click", exportAnyLabelingJson);

  function arrayBufferToBase64(buf){
    const bytes = new Uint8Array(buf);
    let bin = "";
    const CH = 0x8000;
    for (let i = 0; i < bytes.length; i += CH){
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    }
    return btoa(bin);
  }

  async function imageBase64(){
    // 0) 由 JSON 载入的图像：原样复用其 base64 载荷
    if (state.imgB64) return state.imgB64;
    // 1) 单文件版：IMG_SRC 本身就是 data URI，直接取载荷
    const m = /^data:[^;,]*(?:;[^,]*)?;base64,([\s\S]*)$/.exec(IMG_SRC);
    if (m) return m[1];
    // 2) 通过 HTTP 读取原图字节（避免画布跨域污染）
    try {
      const resp = await fetch(IMG_SRC);
      if (resp.ok) return arrayBufferToBase64(await resp.arrayBuffer());
    } catch(err){ /* 走回退 */ }
    // 3) 回退：从画布导出（file:// 直开时可能因污染失败）
    try {
      const off = document.createElement("canvas");
      off.width = state.img.naturalWidth; off.height = state.img.naturalHeight;
      off.getContext("2d").drawImage(state.img, 0, 0);
      return off.toDataURL("image/png").split(",")[1];
    } catch(err){ return null; }
  }

  // ---------- 弯曲 ROI 的多边形拟合 ----------
  // 全保真点数按弦高误差 ≤ POLY_TOL 估计（二次贝塞尔分段误差 ≈ 挠度/(2n²)），
  // 实际取 80%（POLY_RATIO）以近似原始曲率，并限制总点数不超 POLY_MAX。
  const POLY_TOL = 0.5;
  const POLY_RATIO = 0.8;
  const POLY_MAX = 512;

  function polyEdgeCounts(r){
    const counts = [1, 1, 1, 1];        // 直边只输出一个角点
    for (let e = 0; e < 4; e++){
      const b = Math.abs(edgeBend(r, e));
      if (b < 0.5) continue;
      const full = Math.max(2, Math.ceil(Math.sqrt(b / (2*POLY_TOL))));
      counts[e] = Math.max(2, Math.round(full * POLY_RATIO));
    }
    const total = counts.reduce((a, b) => a + b, 0);
    if (total > POLY_MAX){
      // 超上限：按比例压缩曲边点数（每条曲边至少 2 点，直边仍只占 1 点）
      const curved = counts.map((n, i) => ({ i, n })).filter(o => o.n > 1);
      const straight = 4 - curved.length;
      const budget = Math.max(curved.length * 2, POLY_MAX - straight);
      const sum = curved.reduce((a, o) => a + o.n, 0);
      curved.forEach(o => { counts[o.i] = Math.max(2, Math.floor(o.n * budget / sum)); });
    }
    return counts;
  }

  function regionPolygonPoints(r){
    const counts = polyEdgeCounts(r);
    const cs = cornersImage(r);
    const pts = [];
    for (let e = 0; e < 4; e++){
      const n = counts[e];
      if (n <= 1){ pts.push([cs[e].x, cs[e].y]); continue; }
      for (let k = 0; k < n; k++){
        const p = edgePointImage(r, e, k / n);
        pts.push([+p.x.toFixed(3), +p.y.toFixed(3)]);
      }
    }
    return pts;
  }

  function buildAnyLabelingJson(b64){
    return {
      version: "3.2.1",
      flags: {},
      shapes: state.regions.map(r => {
        const bent = hasBend(r);
        return {
          label: r.name,
          score: null,
          points: bent ? regionPolygonPoints(r) : cornersImage(r).map(p => [p.x, p.y]),
          group_id: null,
          description: "",
          difficult: false,
          shape_type: bent ? "polygon" : "rotation",
          flags: {},
          attributes: {},
          kie_linking: [],
          direction: bent ? 0 : r.angle
        };
      }),
      imagePath: "",
      imageData: b64,
      imageHeight: state.imgLoaded ? state.img.naturalHeight : 0,
      imageWidth: state.imgLoaded ? state.img.naturalWidth : 0
    };
  }

  // 导出文件名时间戳后缀：_YYYYMMDD_HHMMSS
  function timeStampSuffix(){
    const d = new Date();
    const p = n => String(n).padStart(2, "0");
    return "_" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) +
           "_" + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  }

  async function exportAnyLabelingJson(){
    if (!state.imgLoaded){ alert("图像尚未加载完成，无法导出标注。"); return; }
    if (!state.regions.length){ alert("当前没有 ROI 区域可导出。"); return; }
    const b64 = await imageBase64();
    if (!b64){ alert("无法内嵌图像：请通过 HTTP 打开页面，或使用单文件版（index.single.html）。"); return; }
    const json = buildAnyLabelingJson(b64);
    const txt = JSON.stringify(json, null, 2);
    const isDataUri = /^data:/i.test(IMG_SRC);
    const base = state.imgName
      ? state.imgName.replace(/\.[^.]+$/, "")
      : (isDataUri ? "annotations" : (IMG_SRC.split("/").pop() || "annotations").replace(/\.[^.]+$/, ""));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([txt], { type: "application/json" }));
    a.download = base + timeStampSuffix() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  // ---------- 属性页 ----------
  let snapshot = null;
  const dlgWrap = document.getElementById("dialogWrap");
  const dlg = document.getElementById("dialog");

  function syncDisplayUI(){
    const shown = state.displayMode === "hidden" ? "全部隐藏" : "仅输入图形";
    document.getElementById("displayBtn").textContent = shown;
    document.getElementById("displayEq").textContent = state.displayMode === "hidden" ? "= 0" : "= 1";
    document.querySelectorAll("#comboDisplay .combo-list div").forEach(d => {
      d.classList.toggle("sel", d.dataset.v === state.displayMode);
    });
    document.querySelectorAll("#dialog .box").forEach(b => {});
  }

  function refreshChecks(){
    const map = [["boxMove","ckMove",state.allowMove],["boxSize","ckSize",state.allowSize],
                 ["boxRot","ckRot",state.allowRotate],["boxCurve","ckCurve",state.allowCurve]];
    map.forEach(([box, cb, val]) => {
      document.getElementById(cb).checked = val;
      document.getElementById(box).classList.toggle("on", val);
    });
  }

  [["ckMove","boxMove","allowMove"],["ckSize","boxSize","allowSize"],
   ["ckRot","boxRot","allowRotate"],["ckCurve","boxCurve","allowCurve"]].forEach(([cb, box, key]) => {
    document.getElementById(cb).addEventListener("change", e => {
      state[key] = e.target.checked;
      document.getElementById(box).classList.toggle("on", e.target.checked);
    });
  });

  document.querySelectorAll("[data-spin]").forEach(btn => {
    btn.addEventListener("click", () => {
      const [id, delta] = btn.dataset.spin.split(":");
      const el = document.getElementById(id);
      const step = parseFloat(el.step) || 1;
      el.value = (parseFloat(el.value || "0") + Number(delta) * step).toFixed(3);
    });
  });

  const combo = document.getElementById("comboDisplay");
  document.getElementById("displayBtn").addEventListener("click", e => {
    e.stopPropagation();
    combo.classList.toggle("open");
  });
  document.querySelectorAll("#comboDisplay .combo-list div").forEach(d => {
    d.addEventListener("click", () => {
      state.displayMode = d.dataset.v;
      combo.classList.remove("open");
      syncDisplayUI();
      draw();
    });
  });
  document.addEventListener("click", () => combo.classList.remove("open"));

  function openDialog(){
    const r = sel();
    if (!r) { addRegion(); }
    const rr = sel();
    snapshot = {
      x: rr.x, y: rr.y, angle: rr.angle, name: rr.name,
      mode: state.displayMode,
      move: state.allowMove, size: state.allowSize,
      rot: state.allowRotate, curve: state.allowCurve
    };
    document.getElementById("inX").value = fmt3(rr.x - rr.w/2);
    document.getElementById("inY").value = fmt3(rr.y - rr.h/2);
    document.getElementById("inA").value = fmt3(rr.angle);
    document.getElementById("inName").value = "";
    refreshChecks();
    syncDisplayUI();
    dlgWrap.classList.add("open");
  }
  function closeDialog(){
    dlgWrap.classList.remove("open");
    combo.classList.remove("open");
  }

  document.getElementById("dlgOk").addEventListener("click", () => {
    const r = sel();
    if (r){
      const left = parseFloat(document.getElementById("inX").value) || 0;
      const top  = parseFloat(document.getElementById("inY").value) || 0;
      r.x = left + r.w/2;
      r.y = top + r.h/2;
      r.angle = parseFloat(document.getElementById("inA").value) || 0;
      normalizeAngle(r);
      r.name = document.getElementById("inName").value.trim() || r.name;
    }
    closeDialog();
    syncToolbar(); draw();
  });
  document.getElementById("dlgCancel").addEventListener("click", () => {
    if (snapshot){
      state.displayMode = snapshot.mode;
      state.allowMove = snapshot.move;
      state.allowSize = snapshot.size;
      state.allowRotate = snapshot.rot;
      state.allowCurve = snapshot.curve;
    }
    closeDialog(); refreshChecks(); syncDisplayUI(); draw();
  });
  document.getElementById("dlgClose").addEventListener("click", () => {
    document.getElementById("dlgCancel").click();
  });
  dlgWrap.addEventListener("click", e => { if (e.target === dlgWrap) document.getElementById("dlgCancel").click(); });

  // 标题栏拖动
  (function(){
    const title = document.getElementById("dlgTitle");
    let drag = null;
    title.addEventListener("pointerdown", e => {
      if (e.target.closest(".win-btn")) return;
      const rect = dlg.getBoundingClientRect();
      dlg.style.transform = "none";
      dlg.style.left = rect.left + "px";
      dlg.style.top = rect.top + "px";
      drag = { dx: e.clientX - rect.left, dy: e.clientY - rect.top };
      title.setPointerCapture(e.pointerId);
    });
    title.addEventListener("pointermove", e => {
      if (!drag) return;
      dlg.style.left = (e.clientX - drag.dx) + "px";
      dlg.style.top = (e.clientY - drag.dy) + "px";
    });
    title.addEventListener("pointerup", () => { drag = null; });
  })();

  // ---------- 键盘 ----------
  window.addEventListener("keydown", e => {
    if (e.key === "F2") { e.preventDefault(); openDialog(); return; }
    if (e.key === "Escape" && dlgWrap.classList.contains("open")) { document.getElementById("dlgCancel").click(); return; }
    if (dlgWrap.classList.contains("open")) return;
    if (e.key === "Insert") { e.preventDefault(); addRegion(); }
    if (e.key === "Delete") { e.preventDefault(); deleteSelected(); }
    if (e.key === "+" || e.key === "=") { state.zoom = clamp(state.zoom*1.1, .1, 10); draw(); }
    if (e.key === "-") { state.zoom = clamp(state.zoom*0.9, .1, 10); draw(); }
    if (e.key === "0") { fitView(); }
  });

  // ---------- 启动 ----------
  window.addEventListener("resize", resizeCanvas);

  loadImageSrc(IMG_SRC, "图像_0000_20261102055654.png", null);

  resizeCanvas();
  syncToolbar();
  syncDisplayUI();
  refreshChecks();
  updateStatus();
}
